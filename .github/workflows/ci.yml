name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Two checks are deliberately absent so this workflow starts green:
      #
      #   lint       `npm run lint` still calls `next lint`, which Next 16
      #              removed, and no ESLint flat config exists. Restore the
      #              step after migrating to `eslint .` with an eslint.config.mjs.
      #   typecheck  `tsc --noEmit` currently reports four pre-existing errors
      #              (missing vitest types, two unresolved module paths, an
      #              undefined `setSource` in onboarding-client.tsx).
      #
      # A red CI everyone learns to ignore is worse than a narrow green one.

      # The build needs this at compile time for anything inlined into client
      # bundles. It is a public origin, not a secret — the real value is set
      # per-environment on the host that serves the app.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GATEWAY_URL: https://api.elpino.chat
