name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both checks must pass. Lint reports warnings for patterns that are still widespread (see
      # eslint.config.mjs) but fails on real errors, so a red check always means something to fix.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The build needs this at compile time for anything inlined into client
      # bundles. It is a public origin, not a secret — the real value is set
      # per-environment on the host that serves the app.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GATEWAY_URL: https://api.elpino.chat
